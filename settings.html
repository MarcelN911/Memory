<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory – Settings</title>
</head>
<body class="settings-page">
    <main class="settings" data-theme="code">
        <div class="settings__container">
        <h1 class="settings__title">Settings</h1>
        <div class="settings__layout">
            <form class="settings__form" id="settingsForm">
                <fieldset class="settings__group">
                    <legend class="settings__legend settings__legend--theme">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.4 0 2-.9 2-1.8 0-1-.8-1.4-.8-2.4 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4c0-4.4-4-8.2-9-8.2Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="11" r="1.3" fill="currentColor"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor"/><circle cx="16" cy="11" r="1.3" fill="currentColor"/></svg>
                        Game themes
                    </legend>
                    <label class="radio">
                        <input type="radio" name="theme" value="code" checked>
                        <span class="radio__label">Code vibes theme</span>
                    </label>
                    <label class="radio">
                        <input type="radio" name="theme" value="foot">
                        <span class="radio__label">Foods theme</span>
                    </label>
                </fieldset>

                <fieldset class="settings__group">
                    <legend class="settings__legend settings__legend--player">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                        Choose player
                    </legend>
                    <label class="radio">
                        <input type="radio" name="player" value="blue" checked>
                        <span class="radio__label">Blue</span>
                    </label>
                    <label class="radio">
                        <input type="radio" name="player" value="orange">
                        <span class="radio__label">Orange</span>
                    </label>
                </fieldset>

                <fieldset class="settings__group">
                    <legend class="settings__legend settings__legend--board">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="11" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m17 5 3 1-3.5 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        Board size
                    </legend>
                    <label class="radio">
                        <input type="radio" name="board" value="16" checked>
                        <span class="radio__label">16 cards</span>
                    </label>
                    <label class="radio">
                        <input type="radio" name="board" value="24">
                        <span class="radio__label">24 cards</span>
                    </label>
                    <label class="radio">
                        <input type="radio" name="board" value="36">
                        <span class="radio__label">36 cards</span>
                    </label>
                </fieldset>
            </form>

            <div class="settings__side">
                <div class="preview" id="preview">
                    <div class="preview__bar">
                        <span class="preview__scores">
                            <span class="preview__score preview__score--blue">Blue 0</span>
                            <span class="preview__score preview__score--orange">Orange 0</span>
                        </span>
                        <span class="preview__current">Current player: <i class="preview__dot"></i></span>
                        <span class="preview__exit">Exit game</span>
                    </div>
                    <div class="preview__cards">
                        <div class="preview__card preview__card--back">
                            <img src="/assets/card-top.png" alt="">
                        </div>
                        <div class="preview__card preview__card--front">
                            <img id="previewImage" src="/assets/code_theme/code_card1.png" alt="Preview card">
                        </div>
                    </div>
                </div>

                <div class="summary">
                    <span class="summary__item">Game theme</span>
                    <span class="summary__divider"></span>
                    <span class="summary__item">Player</span>
                    <span class="summary__divider"></span>
                    <span class="summary__item">Board size</span>
                    <button class="btn btn--start" type="submit" form="settingsForm">
                        <img src="/assets/controller.png" alt="" class="btn__icon">
                        <span class="btn__label">Start</span>
                    </button>
                </div>
            </div>
        </div>
        </div>
    </main>
    <script type="module" src="/src/settings.ts"></script>
</body>
</html>
